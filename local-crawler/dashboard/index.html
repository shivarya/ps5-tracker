<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PS5 Tracker — Local Crawler Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 32px 0 8px; color: #aaa; }
  .meta { color: #888; font-size: 12px; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #333; }
  th { color: #999; font-weight: 600; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .badge.in_stock { background: #1b4332; color: #74c69d; }
  .badge.out_of_stock { background: #3a3a3a; color: #ccc; }
  .badge.blocked { background: #4a1f1f; color: #e07a7a; }
  .badge.error { background: #4a1f1f; color: #e07a7a; }
  .badge.unknown { background: #333; color: #999; }
  .run-row { cursor: pointer; }
  .run-row:hover { background: #1a1a1a; }
  .run-detail { display: none; background: #161616; }
  .run-detail.open { display: table-row; }
  .err { color: #e07a7a; }
  .ok { color: #74c69d; }
  .empty { color: #666; padding: 16px 0; }
  form#add-listing { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; background: #161616; padding: 16px; border-radius: 6px; }
  form#add-listing label { display: flex; flex-direction: column; font-size: 12px; color: #999; gap: 4px; }
  form#add-listing input, form#add-listing select { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px 8px; font-size: 13px; }
  form#add-listing input[name="url"] { width: 320px; }
  form#add-listing button { background: #2d6a4f; color: #eee; border: none; border-radius: 4px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
  form#add-listing button:hover { background: #1b4332; }
  form#add-listing button:disabled { background: #333; color: #777; cursor: default; }
  #add-listing-message { margin-top: 10px; font-size: 13px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .filter-chip { background: #1c1c1c; color: #ccc; border: 1px solid #3a3a3a; border-radius: 14px; padding: 5px 14px; font-size: 13px; cursor: pointer; }
  .filter-chip:hover { background: #262626; }
  .filter-chip.active { background: #2d6a4f; color: #eee; border-color: #2d6a4f; }
  .section-header td { padding-top: 18px; padding-bottom: 4px; color: #999; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: none; }
</style>
</head>
<body>
  <h1>PS5 Tracker — Local Crawler Dashboard</h1>
  <div class="meta" id="meta">loading…</div>

  <h2>Add a tracked listing</h2>
  <form id="add-listing">
    <label>Store
      <select name="store" required>
        <option value="reliance_digital">Reliance Digital</option>
        <option value="vijay_sales">Vijay Sales</option>
        <option value="sony_center">Sony Center</option>
        <option value="croma">Croma</option>
        <option value="flipkart">Flipkart</option>
        <option value="games_the_shop">Games The Shop</option>
        <option value="amazon">Amazon</option>
        <option value="blinkit">Blinkit</option>
        <option value="instamart">Instamart</option>
      </select>
    </label>
    <label>Edition
      <select name="edition">
        <option value="digital">Digital</option>
        <option value="disc">Disc</option>
        <option value="pro">Pro</option>
      </select>
    </label>
    <label>Product URL
      <input type="url" name="url" placeholder="https://..." required />
    </label>
    <label>Product name (optional)
      <input type="text" name="product_name" placeholder="PS5 Slim Disc" />
    </label>
    <label>Pincode
      <input type="text" name="pincode" value="560067" pattern="[0-9]{6}" />
    </label>
    <button type="submit">Add listing</button>
  </form>
  <div id="add-listing-message"></div>

  <h2>Current listing status (all tracked listings)</h2>
  <div class="filter-row" id="edition-filter">
    <button class="filter-chip active" data-edition="all">All</button>
    <button class="filter-chip" data-edition="disc">Disc</button>
    <button class="filter-chip" data-edition="digital">Digital</button>
    <button class="filter-chip" data-edition="pro">Pro</button>
  </div>
  <table id="status-table">
    <thead><tr><th>Store</th><th>Product</th><th>URL</th><th>Pincode</th><th>Polled by</th><th>Status</th><th>Last checked</th></tr></thead>
    <tbody id="status-body"><tr><td colspan="7" class="empty">loading…</td></tr></tbody>
  </table>

  <h2>Recent crawler runs (click a row for detail)</h2>
  <table id="runs-table">
    <thead><tr><th>Started</th><th>Checked</th><th>Transitions</th><th>Result</th></tr></thead>
    <tbody id="runs-body"><tr><td colspan="4" class="empty">loading…</td></tr></tbody>
  </table>

<script>
const LOCAL_STORES = ['croma', 'flipkart', 'games_the_shop', 'amazon', 'blinkit', 'instamart'];
// Server-cron stores that the local crawler also backs up when the server-side check is
// blocked/error (index.js's BACKUP_CHECKERS) — not unconditional like LOCAL_STORES.
const BACKUP_STORES = ['reliance_digital', 'vijay_sales', 'sony_center'];
const EDITION_ORDER = ['disc', 'digital', 'pro'];
const EDITION_LABELS = { disc: 'Disc', digital: 'Digital', pro: 'Pro' };

function polledByLabel(store) {
  if (LOCAL_STORES.includes(store)) return 'local crawler';
  if (BACKUP_STORES.includes(store)) return 'server cron (+ local backup)';
  return 'server cron';
}

let editionFilter = 'all';
let lastStatusData = [];

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function storeLabel(store) {
  return store.split('_').map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function badge(status) {
  return `<span class="badge ${status}">${status}</span>`;
}

function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString();
}

function listingRow(l) {
  return `
    <tr>
      <td>${esc(storeLabel(l.store))}</td>
      <td>${esc(l.product_name || '—')}</td>
      <td><a href="${esc(l.url)}" target="_blank" rel="noopener" style="color:#7aa2e0; word-break: break-all;">${esc(l.url)}</a></td>
      <td>${esc(l.pincode)}</td>
      <td>${polledByLabel(l.store)}</td>
      <td>${badge(l.last_status)}</td>
      <td>${fmtTime(l.last_checked_at)}</td>
    </tr>
  `;
}

function renderStatusTable() {
  const body = document.getElementById('status-body');
  const data = lastStatusData;
  if (data.length === 0) {
    body.innerHTML = '<tr><td colspan="7" class="empty">No listings tracked yet — use the form above.</td></tr>';
    return;
  }
  const visible = editionFilter === 'all' ? data : data.filter((l) => l.edition === editionFilter);
  if (visible.length === 0) {
    body.innerHTML = `<tr><td colspan="7" class="empty">No ${EDITION_LABELS[editionFilter] || ''} listings tracked yet.</td></tr>`;
    return;
  }
  if (editionFilter !== 'all') {
    const sorted = [...visible].sort((a, b) => a.store.localeCompare(b.store));
    body.innerHTML = sorted.map(listingRow).join('');
    return;
  }
  // "All" view: grouped by edition, each group sorted by store, same as the mobile app.
  body.innerHTML = EDITION_ORDER
    .map((edition) => {
      const group = visible.filter((l) => l.edition === edition).sort((a, b) => a.store.localeCompare(b.store));
      if (group.length === 0) return '';
      return `<tr class="section-header"><td colspan="7">${EDITION_LABELS[edition]}</td></tr>` + group.map(listingRow).join('');
    })
    .join('');
}

async function loadStatus() {
  const body = document.getElementById('status-body');
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    lastStatusData = data;
    renderStatusTable();
  } catch (err) {
    body.innerHTML = `<tr><td colspan="7" class="err">Failed to load: ${err.message}</td></tr>`;
  }
}

document.getElementById('edition-filter').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-chip');
  if (!btn) return;
  editionFilter = btn.dataset.edition;
  document.querySelectorAll('#edition-filter .filter-chip').forEach((b) => b.classList.toggle('active', b === btn));
  renderStatusTable();
});

async function loadRuns() {
  const body = document.getElementById('runs-body');
  const meta = document.getElementById('meta');
  try {
    const res = await fetch('/api/runs');
    const runs = await res.json();
    meta.textContent = `${runs.length} run(s) logged · refreshes every 30s`;
    if (runs.length === 0) {
      body.innerHTML = '<tr><td colspan="4" class="empty">No runs logged yet — run `node index.js` once.</td></tr>';
      return;
    }
    body.innerHTML = runs.map((run, i) => {
      const detailRows = (run.checked || []).map((c) => `
        <tr><td></td><td colspan="3">
          ${esc(c.store.replace(/_/g, ' '))} — ${esc(c.product_name || c.url)} → ${badge(c.status)}
          ${c.error ? `<span class="err"> (${esc(c.error)})</span>` : ''}
        </td></tr>
      `).join('') || '<tr><td></td><td colspan="3" class="empty">No listings checked this run.</td></tr>';
      return `
        <tr class="run-row" onclick="document.getElementById('detail-${i}').classList.toggle('open')">
          <td>${fmtTime(run.startedAt)}</td>
          <td>${(run.checked || []).length}</td>
          <td>${(run.transitions || []).length}</td>
          <td>${run.error ? `<span class="err">error: ${esc(run.error)}</span>` : '<span class="ok">ok</span>'}</td>
        </tr>
        <tr id="detail-${i}" class="run-detail"><td colspan="4"><table>${detailRows}</table></td></tr>
      `;
    }).join('');
  } catch (err) {
    body.innerHTML = `<tr><td colspan="4" class="err">Failed to load: ${err.message}</td></tr>`;
  }
}

function refresh() {
  loadStatus();
  loadRuns();
}

document.getElementById('add-listing').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const button = form.querySelector('button');
  const msg = document.getElementById('add-listing-message');
  const payload = {
    store: form.store.value,
    edition: form.edition.value,
    url: form.url.value.trim(),
    product_name: form.product_name.value.trim() || undefined,
    pincode: form.pincode.value.trim() || undefined,
  };

  button.disabled = true;
  msg.textContent = 'Adding…';
  msg.className = '';

  try {
    const res = await fetch('/api/listings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || `HTTP ${res.status}`);
    }
    msg.textContent = `Added: ${data.data.store} — ${data.data.url}`;
    msg.className = 'ok';
    form.reset();
    form.pincode.value = '560067';
    loadStatus();
  } catch (err) {
    msg.textContent = `Failed: ${err.message}`;
    msg.className = 'err';
  } finally {
    button.disabled = false;
  }
});

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
